<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Gerenciador de Tarefas</title>
  <desc id="desc">Ilustração conceitual de um painel de tarefas com três etapas de acompanhamento.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#121936"/><stop offset="1" stop-color="#0b1029"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="0"><stop stop-color="#a7a8f8"/><stop offset="1" stop-color="#5e8dff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#030819" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <circle cx="1070" cy="60" r="300" fill="#604bba" opacity=".12"/>
  <circle cx="155" cy="520" r="280" fill="#3381d6" opacity=".08"/>
  <text x="78" y="78" fill="#a7a8f8" font-family="Arial,sans-serif" font-size="18" letter-spacing="4">SISTEMA SOB MEDIDA</text>
  <text x="78" y="135" fill="#f6f9dc" font-family="Arial,sans-serif" font-size="45" font-weight="700">Gerenciador de Tarefas</text>
  <g filter="url(#shadow)">
    <rect x="78" y="174" width="1044" height="350" rx="22" fill="#1c2549"/>
    <rect x="78" y="174" width="1044" height="57" rx="22" fill="#28355c"/>
    <rect x="78" y="207" width="1044" height="24" fill="#28355c"/>
    <circle cx="111" cy="203" r="6" fill="#a7a8f8"/><circle cx="134" cy="203" r="6" fill="#638dff"/><circle cx="157" cy="203" r="6" fill="#50628f"/>
    <text x="929" y="208" fill="#b7c4e0" font-family="Arial,sans-serif" font-size="14">Visão de tarefas</text>
    <g font-family="Arial,sans-serif" font-size="18" font-weight="700">
      <text x="117" y="275" fill="#cad3ed">A fazer</text><text x="455" y="275" fill="#cad3ed">Em andamento</text><text x="793" y="275" fill="#cad3ed">Concluído</text>
    </g>
    <rect x="112" y="295" width="300" height="176" rx="14" fill="#253154"/>
    <rect x="450" y="295" width="300" height="176" rx="14" fill="#253154"/>
    <rect x="788" y="295" width="300" height="176" rx="14" fill="#253154"/>
    <g fill="#9caed5" opacity=".55">
      <rect x="134" y="324" width="210" height="10" rx="5"/><rect x="134" y="348" width="246" height="8" rx="4"/><rect x="134" y="367" width="160" height="8" rx="4"/>
      <rect x="472" y="324" width="196" height="10" rx="5"/><rect x="472" y="348" width="248" height="8" rx="4"/><rect x="472" y="367" width="172" height="8" rx="4"/>
      <rect x="810" y="324" width="210" height="10" rx="5"/><rect x="810" y="348" width="250" height="8" rx="4"/><rect x="810" y="367" width="145" height="8" rx="4"/>
    </g>
    <rect x="134" y="420" width="84" height="22" rx="11" fill="#445a94"/><rect x="472" y="420" width="100" height="22" rx="11" fill="url(#accent)"/><rect x="810" y="420" width="90" height="22" rx="11" fill="#496e84"/>
